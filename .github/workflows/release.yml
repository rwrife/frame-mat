name: Windows Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Verify release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must use a v-prefixed semantic version: $env:RELEASE_TAG"
          }
          git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag does not exist: $env:RELEASE_TAG"
          }
      - name: Test and build portable Windows app
        shell: pwsh
        run: |
          $flutterVersion = (flutter --version) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $flutterVersion -notmatch '^Flutter 3\.44\.0 ') {
            throw 'Unexpected Flutter version.'
          }
          $dartVersion = dart --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $dartVersion -notmatch 'Dart SDK version: 3\.12\.0') {
            throw 'Unexpected Dart version.'
          }
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
          $buildName = $env:RELEASE_TAG.Substring(1)
          flutter build windows --release --build-name $buildName
          $release = 'build\windows\x64\runner\Release'
          if (-not (Test-Path "$release\frame_mat.exe")) {
            throw 'Windows release executable was not produced.'
          }
          if (-not (Test-Path "$release\data\flutter_assets")) {
            throw 'Portable Flutter assets were not produced.'
          }
          Compress-Archive -Path "$release\*" -DestinationPath 'frame-mat-windows.zip' -Force
      - name: Publish Windows release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Frame Mat ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: frame-mat-windows.zip
      - name: Verify published asset URL
        uses: actions/github-script@v7
        with:
          script: |
            const releaseTag = process.env.RELEASE_TAG;
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: releaseTag,
            });
            const asset = release.assets.find(({ name }) => name === 'frame-mat-windows.zip');
            if (!asset?.browser_download_url) {
              core.setFailed(`Release asset URL is missing for ${releaseTag}`);
              return;
            }
            const response = await fetch(asset.browser_download_url, {
              headers: { Range: 'bytes=0-0' },
              redirect: 'follow',
            });
            if (!response.ok) {
              core.setFailed(`Release asset URL returned HTTP ${response.status}`);
              return;
            }
            await response.body?.cancel();
            core.info(`Verified release asset: ${asset.browser_download_url}`);
