name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test with pinned Flutter in Docker
        run: |
          docker build -f .github/Dockerfile.flutter-test -t frame-mat-flutter-test .
          docker run -e HOME=/tmp -v "$PWD:/app" frame-mat-flutter-test sh -c 'git config --global --add safe.directory /app && flutter pub get --enforce-lockfile && dart format --output=none --set-exit-if-changed lib test && flutter analyze && flutter test'

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Verify pinned SDK and test
        shell: bash
        run: |
          flutter --version | grep -F 'Flutter 3.44.0 '
          dart --version 2>&1 | grep -F 'Dart SDK version: 3.12.0'
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
      - name: Build Windows release
        run: flutter build windows --release

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Build Android debug
        run: |
          flutter --version | grep -F 'Flutter 3.44.0 '
          dart --version 2>&1 | grep -F 'Dart SDK version: 3.12.0'
          flutter pub get --enforce-lockfile
          flutter build apk --debug

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Build unsigned iPhone and iPad simulator app
        run: |
          flutter --version | grep -F 'Flutter 3.44.0 '
          dart --version 2>&1 | grep -F 'Dart SDK version: 3.12.0'
          flutter pub get --enforce-lockfile
          flutter build ios --simulator --debug --no-codesign
          test -d build/ios/iphonesimulator/Runner.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/ios/iphonesimulator/Runner.app/Info.plist | grep -Fx 'com.infinityball.framemat'
          /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' build/ios/iphonesimulator/Runner.app/Info.plist | grep -q '2'
